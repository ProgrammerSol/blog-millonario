<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Rápido - Mentalidad Financiera</title>
   
</head>
<style>
        body {
            background-image: url('../fondo.png.jfif');
            font-family: Arial, sans-serif;
            background-color: #041714;
            color: #134e43;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

    


        .container {
            width: 100%;
            max-width: 500px;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
            border: 2px solid #1a4d2e;
        }

        /* Ocultar y mostrar vistas de forma tradicional */
        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        .animation-box {
            background: #eaf2f8;
            border: 2px dashed #bdc3c7;
            border-radius: 16px;
            padding: 40px 20px;
            margin: 15px 0;
            color: #7f8c8d;
        }

        .title-box {
            font-size: 1.2rem;
            font-weight: bold;
            color: #134e43;
            padding: 15px;
            border: 2px solid #bdc3c7;
            border-radius: 16px;
            margin-bottom: 15px;
        }

        .progress-badge {
            display: inline-block;
            background: #e2e8f0;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .question-box {
            font-size: 1.1rem;
            font-weight: bold;
            padding: 15px;
            background: #c8a96a;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            margin-bottom: 15px;
        }

        .answers-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .answer-btn {
            background-color: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            padding: 12px;
            font-size: 1rem;
            cursor: pointer;
            text-align: center;
            width: 100%;
        }

        .answer-btn.selected {
            background-color: #2c3e50;
            color: white;
            border-color: #2c3e50;
        }

        .btn-action {
            background-color: #134e43;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .score-circle {
            width: 100px;
            height: 100px;
            background: #eafaf1;
            border: 4px solid #27ae60;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #27ae60;
            margin: 0 auto 15px auto;
        }

        .result-text-box {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            color: #475569;
        }

        @import url(https://fonts.googleapis.com/css?family=Righteous);

*, *:before, *:after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  position: relative;
  }

html, body {
  height: 100%;
  }
  body {
    text-align: center;
   
    }
  body:before {
    content: '';
    display: inline-block;
    vertical-align: middle;
    font-size: 0;
    height: 100%;
    }

h1 {
  display: inline-block;
  color: ##134e43;
  font-family: 'Righteous', serif;
  font-size: 12em; 
  text-shadow: .03em .03em 0 #c8a96a;
  }
  h1:after {
    content: attr(data-shadow);
    position: absolute;
    top: .06em; left: .06em;
    text-shadow: none;
    background-image:
      linear-gradient(
        45deg,
        transparent 45%,
        rgb(249, 250, 251) 45%,
        rgb(250, 251, 252) 55%,
        transparent 0
        );
    background-size: .05em .05em;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  
    animation: shad-anim 15s linear infinite;
    }

@keyframes shad-anim {
  0% {background-position: 0 0}
  0% {background-position: 100% -100%}
  }
    </style>
<body>

    <div class="container">
        <!-- VISTA 1: INICIO -->
        <div id="view-inicio" class="view active">
            <h1 data-shadow='Test!'>Test!</h1>
             <h2 style="margin: 0; font-size: 1.2rem; color: #c8a96a;">Domina tu mente,crea tu Riqueza.</h2>
             <br>
             
             <div class="title-box">¿Quieres Medir tu Nivel de Mentalidad Financiera?</div>
            
            <button class="btn-action" onclick="iniciarTest()">Comenzar Test</button>
           <a href="https://programmersol.github.io/blog-millonario/index.html" target="_blank">
            <br>
            <br>
        <button class="btn-action">Volver al Blog</button>
    </a>
    <br>
    <br>
<br>
<a href="https://github.com/ProgrammerSol" target="_blank"> Hecho por Sol Peraza</a>
        </div>


        <!-- VISTA 2: PREGUNTAS -->
        <div id="view-preguntas" class="view">
            <div class="progress-badge" id="progress-indicator">1-5</div>
            <div class="question-box" id="question-text">Pregunta aquí</div>
            <div class="answers-container" id="answers-container">
                <!-- Botones generados por JavaScript tradicional -->
            </div>
            <button class="btn-action" id="next-btn" onclick="siguientePregunta()">Siguiente</button>
        </div>

        <!-- VISTA 3: RESULTADOS -->
        <div id="view-resultados" class="view">
            <h3 style="margin:0; color: #1a4d2e;">🎉 ¡Resultado del Test! 🎉</h3>
            <div class="score-circle" id="score-display">0/5</div>
            <div class="result-text-box" id="result-description">Texto de resultado</div>
            <button class="btn-action" onclick="reiniciarTest()">Volver a Jugar</button>
        </div>

        </div>
    </div>

    <script>
        // 1. Creamos una variable global usando var que almacena una lista (un arreglo) de objetos.
        var preguntas = [
            {
                textoPregunta: "¿Qué sueles hacer cuando recibes tus ingresos mensuales?",
                respuestas: [
                    { texto: "Ahorro e invierto un porcentaje antes de gastar", esCorrecta: true },
                    { texto: "Gasto en lo que necesito y si sobra lo guardo", esCorrecta: false },
                    { texto: "Pago deudas y vivo al límite hasta el próximo mes", esCorrecta: false },
                    { texto: "No llevo un control específico de mis ingresos", esCorrecta: false }
                ]
            },
            {
                textoPregunta: "¿Cómo percibes el riesgo al momento de invertir?",
                respuestas: [
                    { texto: "Como una oportunidad analizada para hacer crecer el capital", esCorrecta: true },
                    { texto: "Como algo peligroso que siempre se debe evitar", esCorrecta: false },
                    { texto: "Como una apuesta de suerte o azar", esCorrecta: false },
                    { texto: "No tengo experiencia ni interés en invertir", esCorrecta: false }
                ]
            },
            {
                textoPregunta: "Frente a un gasto imprevisto o emergencia, tú...",
                respuestas: [
                    { texto: "Tengo un fondo de emergencia ahorrado para esto", esCorrecta: true },
                    { texto: "Debo pedir prestado a familiares o amigos", esCorrecta: false },
                    { texto: "Uso la tarjeta de crédito y me preocupo después", esCorrecta: false },
                    { texto: "Quedo completamente desprotegido financieramente", esCorrecta: false }
                ]
            },
            {
                textoPregunta: "¿Cuál es tu enfoque principal al comprar un objeto costoso?",
                respuestas: [
                    { texto: "Evalúo si es un activo, un lujo necesario o un pasivo", esCorrecta: true },
                    { texto: "Si me gusta y lo puedo financiar, lo compro de inmediato", esCorrecta: false },
                    { texto: "Compro para mantener estatus social con los demás", esCorrecta: false },
                    { texto: "Evito comprar cualquier cosa por miedo a gastar", esCorrecta: false }
                ]
            },
            {
                textoPregunta: "Para ti, el concepto de 'educación financiera' significa...",
                respuestas: [
                    { texto: "Una herramienta clave para lograr la libertad y estabilidad", esCorrecta: true },
                    { texto: "Algo complejo que solo entienden los economistas", esCorrecta: false },
                    { texto: "Aprender únicamente a recortar gastos básicos", esCorrecta: false },
                    { texto: "Un tema irrelevante para el día a día", esCorrecta: false }
                ]
            }
        ];

        // 2. Variables globales tradicionales para llevar la cuenta de tres cosas indispensables:
        var indicePreguntaActual = 0; //En qué número de pregunta va el usuario (empezando desde el 0).
        var puntajeTotal = 0; //Cuántas respuestas acertadas acumula.
        var seleccionTemporalCorrecta = false; //Un interruptor temporal que almacena true o false dependiendo de si la última opción que tocó el usuario es la respuesta correcta o incorrecta.

        // 3. Función para cambiar entre pantallas usando getElementById
        function cambiarPantalla(idPantalla) {
            var vistas = document.getElementsByClassName('view');//Busca todos los elementos HTML que tengan la clase .view usando document.getElementsByClassName.
            for (var i = 0; i < vistas.length; i++) {
                vistas[i].style.display = 'none';
                vistas[i].className = 'view';
            }
            var pantallaActiva = document.getElementById(idPantalla);
            pantallaActiva.style.display = 'block';
            pantallaActiva.className = 'view active';
        }
//Con un ciclo for tradicional, recorre todas las pantallas para ocultarlas (style.display = 'none'), y luego busca únicamente la pantalla 
//cuyo ID coincida con el que le pasamos, haciéndola visible (style.display = 'block').
        
// 4. Iniciar el juego
        function iniciarTest() {
            indicePreguntaActual = 0;
            puntajeTotal = 0;
            cambiarPantalla('view-preguntas');
            cargarPreguntaActual();
        }



        // 5. Cargar datos de la pregunta en la interfaz
        function cargarPreguntaActual() {
            seleccionTemporalCorrecta = false;//valúa si esa opción específica era la correcta y cambia la variable a true o la mantiene en false
            
            var preguntaObj = preguntas[indicePreguntaActual];
            
            // Mostrar número de pregunta
            document.getElementById('progress-indicator').innerHTML = (indicePreguntaActual + 1) + " de 5";
//Actualiza los textos en pantalla (innerHTML) para mostrar el indicador de progreso (ej. "1 de 5") y el enunciado de la pregunta.
            // Mostrar texto de la pregunta
            document.getElementById('question-text').innerHTML = preguntaObj.textoPregunta;

            // Limpiar contenedor de respuestas anterior
            var contenedorRespuestas = document.getElementById('answers-container');
            contenedorRespuestas.innerHTML = "";

            // Crear botones de respuesta mediante un ciclo 'for' tradicional
            for (var i = 0; i < preguntaObj.respuestas.length; i++) {//Es la condición para que el ciclo se repita
                var respuestaActual = preguntaObj.respuestas[i];
                //Al final de cada vuelta, aumenta en 1 el valor de i para pasar a la siguiente respuesta.
                var boton = document.createElement('button');//se usa para generar nuevos elementos HTML desde código
                boton.className = 'answer-btn';
                boton.innerHTML = respuestaActual.texto;
//Utiliza un ciclo for clásico para recorrer las opciones de respuesta y crear dinámicamente 
// un elemento <button> por cada una mediante document.createElement('button').

                
                // Función  tradicional para manejar el clic en cada botón
                boton.onclick = (function(esCorrectaBtn, btnElemento) {
                    return function() {
                        // Remover clase 'selected' de todos los botones
                        var todosLosBotones = document.getElementsByClassName('answer-btn');
                        for (var j = 0; j < todosLosBotones.length; j++) {
                            todosLosBotones[j].className = 'answer-btn';
                        }
                        // Agregar clase 'selected' al botón presionado
                        btnElemento.className = 'answer-btn selected';
                        seleccionTemporalCorrecta = esCorrectaBtn;
                    };
                })(respuestaActual.esCorrecta, boton);

                contenedorRespuestas.appendChild(boton);
            }
        }
        //A cada botón se le asigna una función tradicional de escucha de eventos (onclick) 
        // que al ser presionada le quita la clase selected a los demás botones, se la añade 
        // al botón activo y guarda si la respuesta elegida era la correcta.

        // 6. Avanzar a la siguiente pregunta o finalizar
        const siguientePregunta = () => {
            if (seleccionTemporalCorrecta === true) {
                puntajeTotal = puntajeTotal + 1;
            }

            indicePreguntaActual = indicePreguntaActual + 1;
//Revisa si seleccionTemporalCorrecta es true. Si es así, 
// incrementa puntajeTotal sumándole 1 punto.            

            if (indicePreguntaActual < preguntas.length) {
                cargarPreguntaActual();
            } else {
                mostrarResultadosFinales();
            }
        }
 //si aún quedan preguntas por responder, vuelve a llamar a cargarPreguntaActual();
 //  de lo contrario, da por finalizado el test y ejecuta la función de resultados.       

        // 7. Mostrar resultados en la pantalla final
        function mostrarResultadosFinales() {
            cambiarPantalla('view-resultados');
            
            document.getElementById('score-display').innerHTML = puntajeTotal + "/5";

            var mensajeConsejo = "";
            if (puntajeTotal === 5) {
                mensajeConsejo = "¡Excelente mentalidad! Tienes bases sólidas de inteligencia financiera.";
            } else if (puntajeTotal >= 3) {
                mensajeConsejo = "¡Buen trabajo! Vas por el camino correcto, pero puedes optimizar tus finanzas.";
            } else {
                mensajeConsejo = "Es un buen momento para replantear tus hábitos y aprender más sobre finanzas.";
            }

            document.getElementById('result-description').innerHTML = mensajeConsejo;
        }

        // 8. Reiniciar la trivia
        function reiniciarTest() {
            cambiarPantalla('view-inicio');
        }
    </script>
</body>
</html>
